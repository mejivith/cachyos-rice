<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <title id="t">cachyos-rice</title>
  <desc id="d">CachyOS rice with Niri, Noctalia and the Kanagawa Dragon palette</desc>

  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#393836" opacity="0.55"/>
    </pattern>

    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="0.8" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </linearGradient>
    <mask id="fadeRight" maskUnits="userSpaceOnUse" x="680" y="0" width="520" height="300">
      <rect x="680" y="0" width="520" height="300" fill="url(#fade)"/>
    </mask>

    <radialGradient id="glow" cx="0.78" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#c4746e" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#c4746e" stop-opacity="0"/>
    </radialGradient>

    <clipPath id="card"><rect width="1200" height="300" rx="18"/></clipPath>

    <path id="leaf" d="M0 -9 C7 -5 7 5 0 11 C-7 5 -7 -5 0 -9 Z"/>
  </defs>

  <style>
    .mono { font-family: "JetBrains Mono","Fira Code","DejaVu Sans Mono","SF Mono",Menlo,Consolas,monospace; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="#181616"/>
    <rect width="1200" height="300" fill="url(#dots)"/>
    <rect width="1200" height="300" fill="url(#glow)"/>

    <!-- falling leaves -->
    <g opacity="0.5">
      <g>
        <animateTransform attributeName="transform" type="translate" values="560 -20; 520 330" dur="14s" repeatCount="indefinite"/>
        <use href="#leaf" fill="#b6927b" transform="rotate(20)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="640 -20; 690 330" dur="18s" begin="-6s" repeatCount="indefinite"/>
        <use href="#leaf" fill="#c4746e" transform="rotate(-30) scale(0.8)"/>
      </g>
      <g>
        <animateTransform attributeName="transform" type="translate" values="420 -20; 460 330" dur="22s" begin="-12s" repeatCount="indefinite"/>
        <use href="#leaf" fill="#c4b28a" transform="rotate(50) scale(0.7)"/>
      </g>
    </g>

    <!-- left: text -->
    <g class="mono">
      <text x="60" y="76" font-size="14" fill="#737c73" letter-spacing="1">~/.config  /  dotfiles</text>

      <text x="58" y="146" font-size="62" font-weight="700" fill="#c8c093">cachyos<tspan fill="#c4746e">-rice</tspan></text>

      <text x="60" y="184" font-size="19" fill="#a6a69c">
        <tspan fill="#8ba4b0">niri</tspan>
        <tspan fill="#737c73"> · </tspan>
        <tspan fill="#a292a3">noctalia</tspan>
        <tspan fill="#737c73"> · </tspan>
        <tspan fill="#8a9a7b">kanagawa dragon</tspan>
      </text>

      <text x="60" y="226" font-size="15" fill="#c5c9c5"><tspan fill="#8a9a7b">$</tspan> fastfetch<tspan class="cursor" fill="#c4746e"> █</tspan></text>
    </g>

    <!-- palette dots -->
    <g>
      <circle cx="68"  cy="262" r="6" fill="#c4746e"/>
      <circle cx="90"  cy="262" r="6" fill="#b6927b"/>
      <circle cx="112" cy="262" r="6" fill="#c4b28a"/>
      <circle cx="134" cy="262" r="6" fill="#8a9a7b"/>
      <circle cx="156" cy="262" r="6" fill="#8ea4a2"/>
      <circle cx="178" cy="262" r="6" fill="#8ba4b0"/>
      <circle cx="200" cy="262" r="6" fill="#8992a7"/>
      <circle cx="222" cy="262" r="6" fill="#a292a3"/>
    </g>

    <!-- right: scrolling columns, niri-style -->
    <g mask="url(#fadeRight)">
      <!-- bar -->
      <rect x="700" y="30" width="520" height="26" rx="13" fill="#282727" stroke="#393836"/>
      <circle cx="722" cy="43" r="4" fill="#c4746e"/>
      <circle cx="738" cy="43" r="4" fill="#737c73"/>
      <circle cx="754" cy="43" r="4" fill="#737c73"/>
      <rect x="930" y="39" width="60" height="8" rx="4" fill="#393836"/>
      <rect x="1100" y="39" width="40" height="8" rx="4" fill="#393836"/>

      <!-- column 1 -->
      <rect x="700" y="72" width="150" height="116" rx="10" fill="#201e1e" stroke="#393836"/>
      <rect x="714" y="90" width="70"  height="6" rx="3" fill="#8ba4b0" opacity="0.8"/>
      <rect x="714" y="106" width="110" height="6" rx="3" fill="#393836"/>
      <rect x="714" y="122" width="90"  height="6" rx="3" fill="#393836"/>
      <rect x="714" y="138" width="100" height="6" rx="3" fill="#393836"/>

      <rect x="700" y="198" width="150" height="64" rx="10" fill="#201e1e" stroke="#393836"/>
      <rect x="714" y="216" width="60" height="6" rx="3" fill="#a292a3" opacity="0.8"/>
      <rect x="714" y="232" width="100" height="6" rx="3" fill="#393836"/>

      <!-- column 2: focused terminal -->
      <rect x="866" y="72" width="196" height="190" rx="10" fill="#0d0c0c" stroke="#c4746e" stroke-width="1.5"/>
      <rect x="882" y="92"  width="14" height="6" rx="3" fill="#8a9a7b"/>
      <rect x="902" y="92"  width="70" height="6" rx="3" fill="#c5c9c5" opacity="0.8"/>
      <rect x="882" y="112" width="120" height="6" rx="3" fill="#737c73"/>
      <rect x="882" y="128" width="96"  height="6" rx="3" fill="#737c73"/>
      <rect x="882" y="144" width="140" height="6" rx="3" fill="#737c73"/>
      <rect x="882" y="168" width="14" height="6" rx="3" fill="#8a9a7b"/>
      <rect x="902" y="168" width="48" height="6" rx="3" fill="#c5c9c5" opacity="0.8"/>
      <rect x="882" y="188" width="110" height="6" rx="3" fill="#737c73"/>
      <rect x="882" y="204" width="130" height="6" rx="3" fill="#737c73"/>
      <rect x="882" y="232" width="8" height="12" fill="#c4746e" class="cursor"/>

      <!-- column 3 -->
      <rect x="1078" y="72" width="150" height="86" rx="10" fill="#201e1e" stroke="#393836"/>
      <rect x="1092" y="90" width="64" height="6" rx="3" fill="#c4b28a" opacity="0.8"/>
      <rect x="1092" y="106" width="100" height="6" rx="3" fill="#393836"/>
      <rect x="1092" y="122" width="84"  height="6" rx="3" fill="#393836"/>

      <rect x="1078" y="168" width="150" height="94" rx="10" fill="#201e1e" stroke="#393836"/>
      <rect x="1092" y="186" width="56" height="6" rx="3" fill="#8ea4a2" opacity="0.8"/>
      <rect x="1092" y="202" width="110" height="6" rx="3" fill="#393836"/>
      <rect x="1092" y="218" width="90"  height="6" rx="3" fill="#393836"/>
    </g>

    <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="none" stroke="#393836"/>
  </g>
</svg>
